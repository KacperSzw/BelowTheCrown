[package]
name = "below-the-crown"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "A ruthless medieval social sandbox with LLM-driven characters and local multiplayer"
license = "MIT"
repository = "https://github.com/KacperSzw/BelowTheCrown"
default-run = "below-the-crown"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
termwiz = { version = "0.23.3", default-features = false }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
